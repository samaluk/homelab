name: dclint
on:
  push:
    branches:
      - main
      - 'renovate/**'
  pull_request:
    # Run for every base branch, including stacked PRs targeting feature branches.
jobs:
  dclint:
    name: dclint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get Bun version from package.json
        id: bun-version
        run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1]")" >> $GITHUB_OUTPUT

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}
      - run: bunx dclint . -r -c .dclintrc
