services:
  bazarr:
    image: linuxserver/bazarr:1.6.2@sha256:9a625883f054e722795affe5e3ca71057e6ed817ecdf99f4a99624346fcc509c
    container_name: bazarr
    volumes:
      - /volume1/docker/bazarr:/config:rw
      - /volume1/homes/plex:/media
    environment:
      - TZ=America/Santiago
      - PGID=100
      - PUID=1026
    ports:
      - '6767:6767'
    networks:
      - default
      - proxy
    restart: on-failure:5
    healthcheck:
      test: curl -f http://localhost:6767/ || exit 1
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'bazarr'
      traefik.http.routers.bazarr.middlewares: 'hsts@file'
      traefik.http.services.bazarr.loadbalancer.server.port: '6767'
    security_opt:
      - no-new-privileges:false

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
