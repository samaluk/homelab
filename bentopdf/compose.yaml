services:
  bentopdf:
    image: bentopdf/bentopdf-simple:v1.15.4@sha256:ed728002dede243e99da3b5f66a88ef4aa842962d5fc1313a75ab841cc9af237
    container_name: bentopdf
    ports:
      - '5959:8080'
    networks:
      - default
      - proxy
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      traefik.docker.network: 'homelab-proxy'
      traefik.http.routers.bentopdf.rule: 'Host(`bentopdf.${TRAEFIK_DOMAIN:-malukzedan.synology.me}`)'
      traefik.http.routers.bentopdf.entrypoints: 'websecure'
      traefik.http.routers.bentopdf.tls: 'true'
      traefik.http.routers.bentopdf.tls.certresolver: '${TRAEFIK_CERT_RESOLVER:-letsencrypt}'
      traefik.http.routers.bentopdf.middlewares: 'hsts@file'
      traefik.http.routers.bentopdf.service: 'bentopdf'
      traefik.http.services.bentopdf.loadbalancer.server.port: '8080'
      traefik.http.services.bentopdf.loadbalancer.serverstransport: 'default@file'

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
