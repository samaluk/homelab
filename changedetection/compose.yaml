services:
  changedetection:
    image: dgtlmoon/changedetection.io:0.60.9@sha256:04eaae7915bad711160cb15abe160f6d3fabe98bbbd658509d4b7a654000fb2d
    container_name: changedetection
    volumes:
      - /volume1/docker/changedetection:/datastore
    environment:
      - TZ=America/Santiago
      - PGID=100
      - PUID=1026
    ports:
      - '5900:5000'
    networks:
      - default
      - proxy
    restart: always
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'changedetection'
      traefik.http.routers.changedetection.middlewares: 'hsts@file'
      traefik.http.services.changedetection.loadbalancer.server.port: '5000'

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
