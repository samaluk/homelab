services:
  changedetection:
    image: dgtlmoon/changedetection.io:0.70.2@sha256:36ebb3586e9a6b14af6fb488c6e29b60eceb79ee414ecdb6ac2b91dd25b1c7ba
    container_name: changedetection
    volumes:
      - /volume1/docker/changedetection:/datastore
    environment:
      - TZ=America/Santiago
      - PGID=100
      - PUID=1026
    ports:
      - '5900:5000'
    networks:
      - default
      - proxy
    restart: always
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'changedetection'
      traefik.http.routers.changedetection.middlewares: 'hsts@file'
      traefik.http.services.changedetection.loadbalancer.server.port: '5000'

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
