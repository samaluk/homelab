services:
  changedetection:
    image: dgtlmoon/changedetection.io:0.60.8@sha256:34df3680db1cbffc45ac1e9c1514bc0507dd0c5b5fde47d1992fe6f14a7b40e4
    container_name: changedetection
    volumes:
      - /volume1/docker/changedetection:/datastore
    environment:
      - TZ=America/Santiago
      - PGID=100
      - PUID=1026
    ports:
      - '5900:5000'
    networks:
      - default
      - proxy
    restart: always
    labels:
      traefik.enable: 'true'
      traefik.docker.network: 'homelab-proxy'
      traefik.http.routers.changedetection.rule: 'Host(`changedetection.${TRAEFIK_DOMAIN:-malukzedan.synology.me}`)'
      traefik.http.routers.changedetection.entrypoints: 'websecure'
      traefik.http.routers.changedetection.tls: 'true'
      traefik.http.routers.changedetection.tls.certresolver: '${TRAEFIK_CERT_RESOLVER:-letsencrypt}'
      traefik.http.routers.changedetection.middlewares: 'hsts@file'
      traefik.http.routers.changedetection.service: 'changedetection'
      traefik.http.services.changedetection.loadbalancer.server.port: '5000'
      traefik.http.services.changedetection.loadbalancer.serverstransport: 'default@file'

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
