services:
  changedetection:
    image: dgtlmoon/changedetection.io:0.70.3@sha256:47b1e9cc3eff820e6022b655e3fcc948625f60c1770ae8b9c30aa3bf104dc255
    container_name: changedetection
    volumes:
      - /volume1/docker/changedetection:/datastore
    environment:
      - TZ=America/Santiago
      - PGID=100
      - PUID=1026
    ports:
      - '5900:5000'
    networks:
      - default
      - proxy
    restart: always
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'changedetection'
      traefik.http.routers.changedetection.middlewares: 'hsts@file'
      traefik.http.services.changedetection.loadbalancer.server.port: '5000'

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
