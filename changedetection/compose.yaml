services:
  changedetection:
    image: dgtlmoon/changedetection.io:0.60.10@sha256:72f97681f390e4d6ae3e6585e1e0036449910f347144b766fc23910458566a1a
    container_name: changedetection
    volumes:
      - /volume1/docker/changedetection:/datastore
    environment:
      - TZ=America/Santiago
      - PGID=100
      - PUID=1026
    ports:
      - '5900:5000'
    networks:
      - default
      - proxy
    restart: always
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'changedetection'
      traefik.http.routers.changedetection.middlewares: 'hsts@file'
      traefik.http.services.changedetection.loadbalancer.server.port: '5000'

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
