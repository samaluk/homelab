services:
  changedetection:
    image: dgtlmoon/changedetection.io:0.70.4@sha256:b6aae2572a0bf1a671b1b202365ddcfe16a31fa8a60be89df606705731b55f8b
    container_name: changedetection
    volumes:
      - /volume1/docker/changedetection:/datastore
    environment:
      - TZ=America/Santiago
      - PGID=100
      - PUID=1026
    ports:
      - '5900:5000'
    networks:
      - default
      - proxy
    restart: always
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'changedetection'
      traefik.http.routers.changedetection.middlewares: 'hsts@file'
      traefik.http.services.changedetection.loadbalancer.server.port: '5000'

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
