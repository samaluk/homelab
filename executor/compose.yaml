services:
  executor:
    image: ghcr.io/usefulsoftwareco/executor-selfhost:2.0.0-beta.41@sha256:712dc482432c918d48a84f80cc79b12125e951f9bb6929efc7b4594e5523c576
    container_name: executor
    volumes:
      - /srv/executor-v2:/app/data
      - /srv/executor-v2-motel:/app/motel-data
    environment:
      BETTER_AUTH_URL: ${EXECUTOR_WEB_BASE_URL:?Missing EXECUTOR_WEB_BASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Missing BETTER_AUTH_SECRET}
      EXECUTOR_APPS_ALLOW_PRIVATE_FETCH: 'false'
      EXECUTOR_DISABLE_ANALYTICS: '1'
    ports:
      - '127.0.0.1:4788:4400'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'executor-host', 'health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    user: '1000:1000'
    cpus: 1.0
    init: true
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
