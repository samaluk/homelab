services:
  home-assistant:
    image: linuxserver/homeassistant:2026.8.2@sha256:0fe257d396f052a43fc344eaddc1efad63b95a8de140d39b3be91d39cd6a77fa
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: unless-stopped
    privileged: true
