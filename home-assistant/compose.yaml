services:
  home-assistant:
    image: linuxserver/homeassistant:2026.8.1@sha256:1a33be798f6f9c084433ceff31b10267e3d66312d206b4fbff475109719aec3a
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: unless-stopped
    privileged: true
