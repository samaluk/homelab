services:
  home-assistant:
    image: linuxserver/homeassistant:2026.9.4@sha256:37be06af4a5c28b9a9f93857cc060961847d876a8bbcfebe26bca2a18c570598
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: unless-stopped
    privileged: true
