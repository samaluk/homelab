services:
  home-assistant:
    image: linuxserver/homeassistant:2026.10.4@sha256:ed6882bb24cc2e43857578c320b8e12b2b2fa768a6ef573ca8f768dcf1d48b22
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: unless-stopped
    privileged: true
