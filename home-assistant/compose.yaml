services:
  home-assistant:
    image: linuxserver/homeassistant:2026.8.3@sha256:e87d92ac0b818cdd7e57ea118b129cfcef2c795b3dcaff557d185404fec2af83
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: unless-stopped
    privileged: true
