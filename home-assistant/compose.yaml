services:
  home-assistant:
    image: linuxserver/homeassistant:2026.11.3@sha256:6d895a49608cfdd7957bd6634169b2ed0ccd8e119d60fb21ffc5c9ee2dafbc79
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: always
    privileged: true
