services:
  home-assistant:
    image: linuxserver/homeassistant:2026.8.2@sha256:a8df1464c6f12efdd559de76561c4c50d063072534b19e29bc323d6aab226fbb
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: unless-stopped
    privileged: true
