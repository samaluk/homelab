services:
  home-assistant:
    image: linuxserver/homeassistant:2026.11.0@sha256:abc052d76efa30451f6e4777294f49bef84df83f29d16f255e5c76ee6343c366
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: unless-stopped
    privileged: true
