services:
  home-assistant:
    image: linuxserver/homeassistant:2026.10.2@sha256:38ca271323058a45cefa5829d58a15761df669f598862ae084d41e0a11d211d2
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: unless-stopped
    privileged: true
