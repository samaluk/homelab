services:
  home-assistant:
    image: linuxserver/homeassistant:2026.7.4@sha256:d3e30a3175ac0edab9c02c3698d9dfbddd84be33697fcebf5b120ccc7e0b98c7
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: unless-stopped
    privileged: true
