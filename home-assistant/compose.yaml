services:
  home-assistant:
    image: linuxserver/homeassistant:2026.10.4@sha256:4b20cdbd9ca5f0d31b98ca4783f6c418939a3a40b0bc1a095450765318a61da2
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: unless-stopped
    privileged: true
