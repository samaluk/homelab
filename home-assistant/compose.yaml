services:
  home-assistant:
    image: linuxserver/homeassistant:2026.9.2@sha256:30c63277378bb71a470f5b67d3fdd2fe2991950ee2c8e7b7c511018405a31d0d
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: unless-stopped
    privileged: true
