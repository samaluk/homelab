services:
  home-assistant:
    image: linuxserver/homeassistant:2026.9.0@sha256:f5aa0e0d1397c68c3c231ebf4397e472ea6fc09cdbd3813aac1058f57c9c1dc7
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: unless-stopped
    privileged: true
