services:
  home-assistant:
    image: linuxserver/homeassistant:2026.8.0@sha256:c949547d4b4a884dec677b4fec01ecb5b0f9801270c49f94788254faef103395
    container_name: home-assistant
    volumes:
      - /volume1/docker/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: 1026
      PGID: 100
      TZ: America/Santiago
    network_mode: host
    restart: unless-stopped
    privileged: true
