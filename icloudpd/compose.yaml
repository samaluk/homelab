x-icloudpd-common: &icloudpd-common
  image: icloudpd/icloudpd:1.33.0@sha256:086e191b031bc779bcd9e698e6704264efab3bd5ee7bebd1ac029ea9899b6b38
  user: 1026:100
  environment:
    TZ: America/Santiago
  volumes:
    - /volume1/docker/icloud2/config:/config
    - ${ICLOUD_DATA_PATH}:/data
  networks:
    - icloudpd_bridge

services:
  icloudpd:
    container_name: icloudpd
    ports:
      - '8085:8080'
    command: >-
      icloudpd --directory /data/PrimarySync --username ${APPLE_USERNAME} --cookie-directory /config/cookies --library "PrimarySync" --folder-structure none --file-match-policy name-size-dedup-with-suffix --live-photo-mov-filename-policy suffix --align-raw as-is --size original --live-photo-size original --auto-delete --watch-with-interval 3600 --password-provider webui --mfa-provider webui --no-progress-bar
    restart: unless-stopped
    <<: *icloudpd-common
    hostname: icloudpd

  icloudpd-auth:
    container_name: icloudpd-auth
    ports:
      - '8086:8080'
    command: >-
      icloudpd --directory /data --username ${APPLE_USERNAME} --cookie-directory /config/cookies --auth-only --password-provider webui --mfa-provider webui --no-progress-bar
    restart: "no"
    <<: *icloudpd-common
    hostname: icloudpd-auth
    profiles:
      - auth

  icloudpd-shared:
    container_name: icloudpd-shared
    command: >-
      icloudpd --directory /data/${ICLOUD_SHARED_LIBRARY_ID} --username ${APPLE_USERNAME} --cookie-directory /config/cookies --library "${ICLOUD_SHARED_LIBRARY_ID}" --folder-structure none --file-match-policy name-size-dedup-with-suffix --live-photo-mov-filename-policy suffix --align-raw as-is --size original --live-photo-size original --auto-delete --watch-with-interval 3600 --password-provider webui --mfa-provider webui --no-progress-bar
    restart: unless-stopped
    <<: *icloudpd-common
    hostname: icloudpd-shared

networks:
  icloudpd_bridge:
    driver: bridge
