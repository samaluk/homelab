services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: jellyfin
    volumes:
      - /volume1/docker/jellyfin/config:/config
      - /volume1/docker/jellyfin/cache:/cache
      - /volume1/homes/plex/TV Shows:/tv
      - type: bind
        source: /volume1/homes/plex
        target: /media
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_SERVER_URL}
    ports:
      - '7359:7359/udp'
      - '8096:8096/tcp'
    networks:
      - default
      - proxy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: 'unless-stopped'
    labels:
      traefik.enable: 'true'
      traefik.docker.network: 'homelab-proxy'
      traefik.http.routers.jellyfin.rule: 'Host(`jellyfin.${TRAEFIK_DOMAIN:-malukzedan.synology.me}`)'
      traefik.http.routers.jellyfin.entrypoints: 'websecure'
      traefik.http.routers.jellyfin.tls: 'true'
      traefik.http.routers.jellyfin.tls.certresolver: '${TRAEFIK_CERT_RESOLVER:-letsencrypt}'
      traefik.http.routers.jellyfin.middlewares: 'hsts@file'
      traefik.http.routers.jellyfin.service: 'jellyfin'
      traefik.http.services.jellyfin.loadbalancer.server.port: '8096'
      traefik.http.services.jellyfin.loadbalancer.serverstransport: 'default@file'
    user: 1026:100

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
