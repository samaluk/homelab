services:
  maintainerr:
    image: jorenn92/maintainerr:3.30.1@sha256:8251a1f0ba5d71acc878846a727fba566ec87cbfbf6a914fb881a5953af53d46
    container_name: maintainerr
    volumes:
      - /volume1/docker/maintainerr:/opt/data
    environment:
      - TZ=America/Santiago
    ports:
      - '6246:6246'
    networks:
      - default
      - proxy
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'maintainerr'
      traefik.http.routers.maintainerr.middlewares: 'hsts@file'
      traefik.http.services.maintainerr.loadbalancer.server.port: '6246'
    user: 1026:100

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
