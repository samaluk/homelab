services:
  maintainerr:
    image: jorenn92/maintainerr:3.32.0@sha256:5dcd5bef9d49c614bb74453df3da198afc05a38d8e2cd96b3669bc2c76a94112
    container_name: maintainerr
    volumes:
      - /volume1/docker/maintainerr:/opt/data
    environment:
      - TZ=America/Santiago
    ports:
      - '6246:6246'
    networks:
      - default
      - proxy
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'maintainerr'
      traefik.http.routers.maintainerr.middlewares: 'hsts@file'
      traefik.http.services.maintainerr.loadbalancer.server.port: '6246'
    user: 1026:100

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
