services:
  maintainerr:
    image: jorenn92/maintainerr:3.30.1@sha256:8251a1f0ba5d71acc878846a727fba566ec87cbfbf6a914fb881a5953af53d46
    container_name: maintainerr
    volumes:
      - /volume1/docker/maintainerr:/opt/data
    environment:
      - TZ=America/Santiago
    ports:
      - '6246:6246'
    networks:
      - default
      - proxy
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      traefik.docker.network: 'homelab-proxy'
      traefik.http.routers.maintainerr.rule: 'Host(`maintainerr.${TRAEFIK_DOMAIN:-malukzedan.synology.me}`)'
      traefik.http.routers.maintainerr.entrypoints: 'websecure'
      traefik.http.routers.maintainerr.tls: 'true'
      traefik.http.routers.maintainerr.tls.certresolver: '${TRAEFIK_CERT_RESOLVER:-letsencrypt}'
      traefik.http.routers.maintainerr.middlewares: 'hsts@file'
      traefik.http.routers.maintainerr.service: 'maintainerr'
      traefik.http.services.maintainerr.loadbalancer.server.port: '6246'
      traefik.http.services.maintainerr.loadbalancer.serverstransport: 'default@file'
    user: 1026:100

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
