services:
  maintainerr:
    image: jorenn92/maintainerr:3.33.0@sha256:124b53cfec9c17dae03a69243b0a2e7b6de740150112b5210b784ce8fa0a2852
    container_name: maintainerr
    volumes:
      - /volume1/docker/maintainerr:/opt/data
    environment:
      - TZ=America/Santiago
    ports:
      - '6246:6246'
    networks:
      - default
      - proxy
    restart: always
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'maintainerr'
      traefik.http.routers.maintainerr.middlewares: 'hsts@file'
      traefik.http.services.maintainerr.loadbalancer.server.port: '6246'
    user: 1026:100

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
