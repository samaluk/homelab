services:
  maintainerr:
    image: jorenn92/maintainerr:3.30.2@sha256:816779316fc9a2d8e45946dc7a0e676784bc1453eaaff701900132ab67d5abba
    container_name: maintainerr
    volumes:
      - /volume1/docker/maintainerr:/opt/data
    environment:
      - TZ=America/Santiago
    ports:
      - '6246:6246'
    networks:
      - default
      - proxy
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'maintainerr'
      traefik.http.routers.maintainerr.middlewares: 'hsts@file'
      traefik.http.services.maintainerr.loadbalancer.server.port: '6246'
    user: 1026:100

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
