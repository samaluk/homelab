services:
  maintainerr:
    image: jorenn92/maintainerr:3.31.0@sha256:33d86e5f03ed25204788b1e9cd9a2b3f0299cf49fae968220484b57008962399
    container_name: maintainerr
    volumes:
      - /volume1/docker/maintainerr:/opt/data
    environment:
      - TZ=America/Santiago
    ports:
      - '6246:6246'
    networks:
      - default
      - proxy
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'maintainerr'
      traefik.http.routers.maintainerr.middlewares: 'hsts@file'
      traefik.http.services.maintainerr.loadbalancer.server.port: '6246'
    user: 1026:100

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
