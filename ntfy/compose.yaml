services:
  ntfy:
    image: binwiederhier/ntfy:v2.28@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    container_name: ntfy

    volumes:
      - /volume1/docker/ntfy/cache:/var/cache/ntfy:rw
      - /volume1/docker/ntfy:/etc/ntfy:rw
    environment:
      - TZ=America/Santiago
    ports:
      - '6741:80'
    networks:
      - default
      - proxy
    command:
      - serve
    restart: on-failure:5
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      traefik.enable: 'true'
      traefik.docker.network: 'homelab-proxy'
      traefik.http.routers.ntfy.rule: 'Host(`ntfy.${TRAEFIK_DOMAIN:-malukzedan.synology.me}`)'
      traefik.http.routers.ntfy.entrypoints: 'websecure'
      traefik.http.routers.ntfy.tls: 'true'
      traefik.http.routers.ntfy.tls.certresolver: '${TRAEFIK_CERT_RESOLVER:-letsencrypt}'
      traefik.http.routers.ntfy.middlewares: 'hsts@file'
      traefik.http.routers.ntfy.service: 'ntfy'
      traefik.http.services.ntfy.loadbalancer.server.port: '80'
      traefik.http.services.ntfy.loadbalancer.serverstransport: 'default@file'

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
