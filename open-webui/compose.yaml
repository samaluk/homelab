services:
  open-webui:
    image: openwebui/open-webui:0.12.2@sha256:10e6a78ba2d172493460a9e8a92c496aaa7a64dc4d26d622a2e95e0c736081c9
    container_name: open-webui
    volumes:
      - /volume1/docker/open-webui/data:/app/backend/data
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_URL=${WEBUI_URL}
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN}
      - ENABLE_SIGNUP=false
      - ENABLE_COMPRESSION_MIDDLEWARE=false
      - WEBUI_SESSION_COOKIE_SECURE=true
      - WEBUI_AUTH_COOKIE_SECURE=true
      - WEBUI_SESSION_COOKIE_SAME_SITE=lax
      - WEBUI_AUTH_COOKIE_SAME_SITE=lax
    ports:
      - '8087:8080'
    networks:
      - default
      - proxy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'llm'
      traefik.http.routers.llm.middlewares: 'hsts@file,streaming@file'
      traefik.http.services.llm.loadbalancer.server.port: '8080'
    pull_policy: always

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
