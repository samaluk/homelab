services:
  prowlarr:
    image: linuxserver/prowlarr:3.0.2@sha256:45117ba8439e2337a92ffe38a451a4dafc0be771754d05d88cdf102419d09646
    container_name: prowlarr
    volumes:
      - /volume1/docker/prowlarr:/config:rw
    environment:
      TZ: America/Santiago
      PGID: 100
      PUID: 1026
    ports:
      - '9696:9696'
    networks:
      - default
      - proxy
    restart: always
    healthcheck:
      test: curl -f http://localhost:9696/ || exit 1
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'prowlarr'
      traefik.http.routers.prowlarr.middlewares: 'hsts@file'
      traefik.http.services.prowlarr.loadbalancer.server.port: '9696'
    security_opt:
      - no-new-privileges:true

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
