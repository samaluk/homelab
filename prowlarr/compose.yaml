services:
  prowlarr:
    image: linuxserver/prowlarr:2.6.5@sha256:f2b26429893d4c4cb71941b7ee50b1bdecd9d5f9f9e02d5410615e9f4f7c8d95
    container_name: prowlarr
    volumes:
      - /volume1/docker/prowlarr:/config:rw
    environment:
      TZ: America/Santiago
      PGID: 100
      PUID: 1026
    ports:
      - '9696:9696'
    networks:
      - default
      - proxy
    restart: on-failure:5
    healthcheck:
      test: curl -f http://localhost:9696/ || exit 1
    labels:
      traefik.enable: 'true'
      traefik.docker.network: 'homelab-proxy'
      traefik.http.routers.prowlarr.rule: 'Host(`prowlarr.${TRAEFIK_DOMAIN:-malukzedan.synology.me}`)'
      traefik.http.routers.prowlarr.entrypoints: 'websecure'
      traefik.http.routers.prowlarr.tls: 'true'
      traefik.http.routers.prowlarr.tls.certresolver: '${TRAEFIK_CERT_RESOLVER:-letsencrypt}'
      traefik.http.routers.prowlarr.middlewares: 'hsts@file'
      traefik.http.routers.prowlarr.service: 'prowlarr'
      traefik.http.services.prowlarr.loadbalancer.server.port: '9696'
      traefik.http.services.prowlarr.loadbalancer.serverstransport: 'default@file'
    security_opt:
      - no-new-privileges:true

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
