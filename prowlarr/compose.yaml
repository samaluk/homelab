services:
  prowlarr:
    image: linuxserver/prowlarr:2.6.5@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
    container_name: prowlarr
    volumes:
      - /volume1/docker/prowlarr:/config:rw
    environment:
      TZ: America/Santiago
      PGID: 100
      PUID: 1026
    ports:
      - '9696:9696'
    networks:
      - default
      - proxy
    restart: on-failure:5
    healthcheck:
      test: curl -f http://localhost:9696/ || exit 1
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'prowlarr'
      traefik.http.routers.prowlarr.middlewares: 'hsts@file'
      traefik.http.services.prowlarr.loadbalancer.server.port: '9696'
    security_opt:
      - no-new-privileges:true

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
