services:
  prowlarr:
    image: linuxserver/prowlarr:3.1.0@sha256:2806c9b763810589c42157730d547c293639e55c7610e9f5069314854639ec48
    container_name: prowlarr
    volumes:
      - /volume1/docker/prowlarr:/config:rw
    environment:
      TZ: America/Santiago
      PGID: 100
      PUID: 1026
    ports:
      - '9696:9696'
    networks:
      - default
      - proxy
    restart: always
    healthcheck:
      test: curl -f http://localhost:9696/ || exit 1
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'prowlarr'
      traefik.http.routers.prowlarr.middlewares: 'hsts@file'
      traefik.http.services.prowlarr.loadbalancer.server.port: '9696'
    security_opt:
      - no-new-privileges:true

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
