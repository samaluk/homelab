services:
  radarr:
    image: linuxserver/radarr:7.0.3@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
    container_name: radarr
    volumes:
      - /volume1/downloads:/downloads
      - /volume1/homes/plex/Movies:/movies
      - /volume1/docker/radarr/config:/config
    environment:
      TZ: America/Santiago
      PGID: 100
      PUID: 1026
    ports:
      - '7878:7878'
    networks:
      - default
      - proxy
    restart: always
    healthcheck:
      test: curl -f http://localhost:7878/ || exit 1
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'radarr'
      traefik.http.routers.radarr.middlewares: 'hsts@file'
      traefik.http.services.radarr.loadbalancer.server.port: '7878'
    security_opt:
      - no-new-privileges:true

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
