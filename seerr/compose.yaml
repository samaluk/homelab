services:
  seerr:
    image: seerr/seerr:v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
    container_name: seerr
    volumes:
      - /volume1/docker/seerr:/app/config
    environment:
      - TZ=America/Santiago
      - PORT=5055
      - PUID=1026
      - PGID=100
    ports:
      - '5055:5055'
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    init: true
