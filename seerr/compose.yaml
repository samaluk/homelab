services:
  seerr:
    image: seerr/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    container_name: seerr
    volumes:
      - /volume1/docker/seerr:/app/config
    environment:
      - TZ=America/Santiago
      - PORT=5055
      - PUID=1026
      - PGID=100
    ports:
      - '5055:5055'
    networks:
      - default
      - proxy
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'seerr'
      traefik.http.routers.seerr.rule: 'Host(`seerr.${TRAEFIK_DOMAIN:-malukzedan.synology.me}`) || Host(`overseerr.${TRAEFIK_DOMAIN:-malukzedan.synology.me}`)'
      traefik.http.routers.seerr.middlewares: 'hsts@file'
      traefik.http.services.seerr.loadbalancer.server.port: '5055'
    init: true

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
