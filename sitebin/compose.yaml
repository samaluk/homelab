services:
  sitebin:
    image: ghcr.io/ittrail/sitebin.io:latest@sha256:2ba5404c2912dd97587a7057e42ca541657d8e70d5317c4b22725c60bfe5829c
    container_name: sitebin
    volumes:
      - /volume1/docker/sitebin:/data
    environment:
      SITEBIN_BASE_DOMAIN: ${SITEBIN_HOST:?Missing SITEBIN_HOST}
      SITEBIN_HTTP_ONLY: 'true'
      SITEBIN_VIEW_ACCESS: path
      SITEBIN_WEBDAV_ENABLED: 'false'
      SITEBIN_MCP_ENABLED: 'false'
      SITEBIN_TRACK_VIEWS: 'false'
      GOMEMLIMIT: 192MiB
    ports:
      - '127.0.0.1:8090:80'
    networks:
      - default
      - proxy
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      traefik.docker.network: 'homelab-proxy'
      traefik.http.routers.reports.rule: 'Host(`reports.${TRAEFIK_DOMAIN:-malukzedan.synology.me}`)'
      traefik.http.routers.reports.entrypoints: 'websecure'
      traefik.http.routers.reports.tls: 'true'
      traefik.http.routers.reports.tls.certresolver: '${TRAEFIK_CERT_RESOLVER:-letsencrypt}'
      traefik.http.routers.reports.middlewares: 'hsts@file'
      traefik.http.routers.reports.service: 'reports'
      traefik.http.services.reports.loadbalancer.server.port: '80'
      traefik.http.services.reports.loadbalancer.serverstransport: 'default@file'
    mem_limit: 384m

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
