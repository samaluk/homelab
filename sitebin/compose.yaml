services:
  sitebin:
    image: ghcr.io/ittrail/sitebin.io:latest@sha256:b2e155aad59d257f084589c76b88d083fee46c999c06657b8fdfc185567509cd
    container_name: sitebin
    volumes:
      - /volume1/docker/sitebin:/data
    environment:
      SITEBIN_BASE_DOMAIN: ${SITEBIN_HOST:?Missing SITEBIN_HOST}
      SITEBIN_HTTP_ONLY: 'true'
      SITEBIN_VIEW_ACCESS: path
      SITEBIN_WEBDAV_ENABLED: 'false'
      SITEBIN_MCP_ENABLED: 'false'
      SITEBIN_TRACK_VIEWS: 'false'
      GOMEMLIMIT: 192MiB
    ports:
      - '127.0.0.1:8090:80'
    networks:
      - default
      - proxy
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'reports'
      traefik.http.routers.reports.middlewares: 'hsts@file'
      traefik.http.services.reports.loadbalancer.server.port: '80'
    mem_limit: 384m

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
