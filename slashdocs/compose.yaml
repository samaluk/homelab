services:
  blob:
    image: versity/versitygw:v1.9.0@sha256:eb7f786fcd91e72194e48fcf1ac16302d686bf8e3a71434bdbc067a6efd3fdc7
    container_name: slashdocs-blob
    volumes:
      - /volume1/docker/slashdocs/blob:/data
    environment:
      ROOT_ACCESS_KEY_ID: ${BLOB_ACCESS_KEY_ID:?Missing BLOB_ACCESS_KEY_ID}
      ROOT_SECRET_ACCESS_KEY: ${BLOB_SECRET_ACCESS_KEY:?Missing BLOB_SECRET_ACCESS_KEY}
      GOMEMLIMIT: 96MiB
    command:
      - -ec
      - mkdir -p /data/slashdocs-documents && exec versitygw --quiet --port :9000 posix /data
    entrypoint: /bin/sh
    restart: unless-stopped
    healthcheck:
      test: [ CMD, nc, -z, 127.0.0.1, '9000' ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    user: '1000:1000'
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    container_name: slashdocs-db
    volumes:
      - /volume1/docker/slashdocs/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: slashdocs
      POSTGRES_USER: slashdocs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: [ CMD, pg_isready, -U, slashdocs, -d, slashdocs ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

  slashdocs:
    image: razorpay/slashdocs:0.4.0@sha256:9310deff681039833b5c7ba3e6664ebb0eda295c2c6399dfe3325d78b5c1bbca
    container_name: slashdocs
    depends_on:
      blob:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://slashdocs:${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}@postgres:5432/slashdocs?sslmode=disable
      BLOB_BUCKET: slashdocs-documents
      BLOB_ENDPOINT: http://blob:9000
      BLOB_REGION: us-east-1
      BLOB_FORCE_PATH_STYLE: 'true'
      BLOB_ACCESS_KEY_ID: ${BLOB_ACCESS_KEY_ID:?Missing BLOB_ACCESS_KEY_ID}
      BLOB_SECRET_ACCESS_KEY: ${BLOB_SECRET_ACCESS_KEY:?Missing BLOB_SECRET_ACCESS_KEY}
      SESSION_SECRET: ${SESSION_SECRET:?Missing SESSION_SECRET}
      SLASHDOCS_APP_ORIGIN: https://${SLASHDOCS_APP_HOST:?Missing SLASHDOCS_APP_HOST}
      SLASHDOCS_RENDER_ORIGIN: https://${SLASHDOCS_RENDER_HOST:?Missing SLASHDOCS_RENDER_HOST}
      SLASHDOCS_DEPLOYMENT: public
      SLASHDOCS_DEFAULT_DOC_PERMISSION: private
      SLASHDOCS_KV_EVENTS_MODE: notify
      SLASHDOCS_OIDC_ISSUER_URL: ${SLASHDOCS_OIDC_ISSUER_URL:?Missing SLASHDOCS_OIDC_ISSUER_URL}
      SLASHDOCS_OIDC_INTERNAL_ISSUER_URL: ${SLASHDOCS_OIDC_INTERNAL_ISSUER_URL:-}
      SLASHDOCS_OIDC_CLIENT_ID: ${SLASHDOCS_OIDC_CLIENT_ID:?Missing SLASHDOCS_OIDC_CLIENT_ID}
      SLASHDOCS_OIDC_CLIENT_SECRET: ${SLASHDOCS_OIDC_CLIENT_SECRET:?Missing SLASHDOCS_OIDC_CLIENT_SECRET}
      SLASHDOCS_OIDC_PROVIDER_NAME: ${SLASHDOCS_OIDC_PROVIDER_NAME:-Homelab}
      GOMEMLIMIT: 384MiB
    networks:
      - default
      - proxy
    restart: unless-stopped
    healthcheck:
      test: [ CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'docs'
      traefik.http.routers.docs.rule: 'Host(`${SLASHDOCS_APP_HOST:?Missing SLASHDOCS_APP_HOST}`) || Host(`${SLASHDOCS_RENDER_HOST:?Missing SLASHDOCS_RENDER_HOST}`)'
      traefik.http.routers.docs.middlewares: 'hsts@file'
      traefik.http.services.docs.loadbalancer.server.port: '8080'
    user: '1000:1000'
    mem_limit: 512m
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777

networks:
  default:
    internal: true
    ipam:
      config:
        - subnet: ${SLASHDOCS_SUBNET:?Missing SLASHDOCS_SUBNET}
  proxy:
    external: true
    name: homelab-proxy
