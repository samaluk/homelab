services:
  sonarr:
    image: linuxserver/sonarr:4.0.20@sha256:f247545d23ba8b233d6604575347e48a623fe6ad75dda02348bf81917f3b5c06
    container_name: sonarr
    volumes:
      - /volume1/downloads:/downloads
      - /volume1/homes/plex/TV Shows:/movies
      - /volume1/docker/sonarr/config:/config
    environment:
      TZ: America/Santiago
      PGID: 100
      PUID: 1026
    ports:
      - '8989:8989'
    networks:
      - default
      - proxy
    restart: on-failure:5
    healthcheck:
      test: curl -f http://localhost:8989/ || exit 1
    labels:
      traefik.enable: 'true'
      traefik.docker.network: 'homelab-proxy'
      traefik.http.routers.sonarr.rule: 'Host(`sonarr.${TRAEFIK_DOMAIN:-malukzedan.synology.me}`)'
      traefik.http.routers.sonarr.entrypoints: 'websecure'
      traefik.http.routers.sonarr.tls: 'true'
      traefik.http.routers.sonarr.tls.certresolver: '${TRAEFIK_CERT_RESOLVER:-letsencrypt}'
      traefik.http.routers.sonarr.middlewares: 'hsts@file'
      traefik.http.routers.sonarr.service: 'sonarr'
      traefik.http.services.sonarr.loadbalancer.server.port: '8989'
      traefik.http.services.sonarr.loadbalancer.serverstransport: 'default@file'
    security_opt:
      - no-new-privileges:true

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
