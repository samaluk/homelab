services:
  tautulli:
    image: tautulli/tautulli:v2.19.0@sha256:2bb66b3632151727c07084f6fbfa31806f0c6e210b513366abdd157f33b2af7a
    container_name: tautulli
    volumes:
      - /volume1/docker/tautulli:/config
    environment:
      - PUID=1026
      - PGID=100
      - TZ=America/Santiago
    ports:
      - '8181:8181'
    networks:
      - default
      - proxy
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'tautulli'
      traefik.http.routers.tautulli.middlewares: 'hsts@file'
      traefik.http.services.tautulli.loadbalancer.server.port: '8181'

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
