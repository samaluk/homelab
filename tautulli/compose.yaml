services:
  tautulli:
    image: tautulli/tautulli:v2.19.1@sha256:239cd6dbc429a0eb441bdf88a7a015871e2d4d6e02b6e6039af30c0487528a8e
    container_name: tautulli
    volumes:
      - /volume1/docker/tautulli:/config
    environment:
      - PUID=1026
      - PGID=100
      - TZ=America/Santiago
    ports:
      - '8181:8181'
    networks:
      - default
      - proxy
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'tautulli'
      traefik.http.routers.tautulli.middlewares: 'hsts@file'
      traefik.http.services.tautulli.loadbalancer.server.port: '8181'

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
