services:
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: traefik-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./socket-proxy/haproxy.cfg:/etc/haproxy/haproxy.cfg:ro
    networks:
      - docker-api
    command: [ -W, -db, -f, /etc/haproxy/haproxy.cfg ]
    entrypoint: haproxy
    restart: unless-stopped
    healthcheck:
      test: [ CMD, wget, -q, --spider, http://127.0.0.1:2375/_ping ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    container_name: traefik
    depends_on:
      socket-proxy:
        condition: service_healthy
    volumes:
      - /volume1/docker/traefik/acme:/acme
      - ./dynamic:/etc/traefik/dynamic:ro
    environment:
      TRAEFIK_NAS_HOST: ${TRAEFIK_NAS_HOST:?Missing TRAEFIK_NAS_HOST}
      TRAEFIK_DOMAIN: ${TRAEFIK_DOMAIN:-malukzedan.synology.me}
      TRAEFIK_CERT_RESOLVER: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      TRAEFIK_OPENCODE_HOST: ${TRAEFIK_OPENCODE_HOST:-127.0.0.1}
      TRAEFIK_T3CODE_HOST: ${TRAEFIK_T3CODE_HOST:-127.0.0.1}
    ports:
      - '8443:443'
      - '8880:80'
    networks:
      proxy:
        ipv4_address: ${TRAEFIK_PROXY_IP:?Missing TRAEFIK_PROXY_IP}
      docker-api:
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=homelab-proxy
      - '--providers.docker.defaultRule=Host(`{{ index .Labels "homelab.hostname" }}.${TRAEFIK_DOMAIN:-malukzedan.synology.me}`)'
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.asdefault=true
      - --entrypoints.websecure.http.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=0
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=0
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?Missing TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/${TRAEFIK_CERT_RESOLVER:-letsencrypt}/production.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.staging.acme.email=${TRAEFIK_ACME_EMAIL:?Missing TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.staging.acme.storage=/acme/${TRAEFIK_CERT_RESOLVER:-letsencrypt}/staging.json
      - --certificatesresolvers.staging.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.staging.acme.httpchallenge.entrypoint=web
      - --serverstransport.forwardingtimeouts.dialtimeout=60s
      - --serverstransport.forwardingtimeouts.responseheadertimeout=60s
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.fields.headers.defaultmode=drop
    restart: unless-stopped
    healthcheck:
      test: [ CMD, wget, -q, --spider, http://127.0.0.1:8080/ping ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    name: homelab-proxy
    ipam:
      config:
        - subnet: ${TRAEFIK_PROXY_SUBNET:?Missing TRAEFIK_PROXY_SUBNET}
          ip_range: ${TRAEFIK_PROXY_DYNAMIC_RANGE:?Missing TRAEFIK_PROXY_DYNAMIC_RANGE}
  docker-api:
    internal: true
    ipam:
      config:
        - subnet: ${TRAEFIK_DOCKER_API_SUBNET:?Missing TRAEFIK_DOCKER_API_SUBNET}
