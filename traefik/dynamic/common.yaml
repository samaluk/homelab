http:
  middlewares:
    hsts:
      headers:
        stsSeconds: 15768000
        stsIncludeSubdomains: true
    streaming:
      headers:
        customResponseHeaders:
          X-Accel-Buffering: 'no'
          Cache-Control: no-cache
  serversTransports:
    default:
      forwardingTimeouts:
        dialTimeout: 60s
        responseHeaderTimeout: 60s
    extended:
      forwardingTimeouts:
        dialTimeout: 300s
        responseHeaderTimeout: 300s
    media:
      forwardingTimeouts:
        dialTimeout: 120s
        responseHeaderTimeout: 120s
