# Only Docker endpoints used by Traefik discovery are permitted.
# Container inspection includes environment metadata; keep this network private.
global
    log stdout format raw daemon warning
    maxconn 256
    hard-stop-after 10s

defaults
    mode http
    log global
    option httplog
    option http-server-close
    timeout http-request 10s
    timeout connect 5s
    timeout client 1d
    timeout server 30s

frontend docker-api
    bind :2375
    acl read_method method GET HEAD
    acl discovery_path path,url_dec -m reg ^(/v[0-9.]+)?/(_ping|version|containers/json|containers/[a-zA-Z0-9_.-]+/json|events)$
    acl events_path path,url_dec -m reg ^(/v[0-9.]+)?/events$
    http-request deny unless read_method discovery_path
    use_backend docker-events if events_path
    default_backend docker

backend docker
    server dockersocket /var/run/docker.sock

backend docker-events
    timeout server 1d
    server dockersocket /var/run/docker.sock
