services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
    container_name: uptime-kuma
    volumes:
      - /volume1/docker/uptime-kuma:/app/data:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: America/Santiago
    ports:
      - '3444:3001'
    networks:
      - default
      - proxy
    restart: on-failure:5
    labels:
      traefik.enable: 'true'
      traefik.docker.network: 'homelab-proxy'
      traefik.http.routers.uptime-kuma.rule: 'Host(`uptime-kuma.${TRAEFIK_DOMAIN:-malukzedan.synology.me}`)'
      traefik.http.routers.uptime-kuma.entrypoints: 'websecure'
      traefik.http.routers.uptime-kuma.tls: 'true'
      traefik.http.routers.uptime-kuma.tls.certresolver: '${TRAEFIK_CERT_RESOLVER:-letsencrypt}'
      traefik.http.routers.uptime-kuma.middlewares: 'hsts@file'
      traefik.http.routers.uptime-kuma.service: 'uptime-kuma'
      traefik.http.services.uptime-kuma.loadbalancer.server.port: '3001'
      traefik.http.services.uptime-kuma.loadbalancer.serverstransport: 'default@file'
    cpu_shares: 1024
    hostname: uptimekuma
    mem_limit: 4g

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
