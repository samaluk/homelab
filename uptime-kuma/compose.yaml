services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8@sha256:20abea8c48a163cf0a7a5d5936ab418e4b742d908704e1f58f6c06e56a9c6b67
    container_name: uptime-kuma
    volumes:
      - /volume1/docker/uptime-kuma:/app/data:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: America/Santiago
    ports:
      - '3444:3001'
    networks:
      - default
      - proxy
    restart: on-failure:5
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'uptime-kuma'
      traefik.http.routers.uptime-kuma.middlewares: 'hsts@file'
      traefik.http.services.uptime-kuma.loadbalancer.server.port: '3001'
    cpu_shares: 1024
    hostname: uptimekuma
    mem_limit: 4g

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
