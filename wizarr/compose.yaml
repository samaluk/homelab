services:
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:v2026.10.0@sha256:6ffcaa64f17c7c2fa9fc11b0b53b86c8309ebe081fc8ab4c9f31ae2c8d143bdd
    container_name: wizarr
    volumes:
      - /volume1/docker/wizarr:/data
    environment:
      - PUID=1026
      - PGID=100
      - DISABLE_BUILTIN_AUTH=false
      - TZ=America/Santiago
    ports:
      - '5690:5690'
    networks:
      - default
      - proxy
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:5690/ || exit 1
      start_period: 30s
      timeout: 5s
      interval: 30s
      retries: 3
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'wizarr'
      traefik.http.routers.wizarr.middlewares: 'hsts@file'
      traefik.http.services.wizarr.loadbalancer.server.port: '5690'

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
