services:
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:v2026.10.1@sha256:08f2c6de534ec7d36d39a4f55b7c5c379021ca881dc519c702aad0ddafbdc67a
    container_name: wizarr
    volumes:
      - /volume1/docker/wizarr:/data
    environment:
      - PUID=1026
      - PGID=100
      - DISABLE_BUILTIN_AUTH=false
      - TZ=America/Santiago
    ports:
      - '5690:5690'
    networks:
      - default
      - proxy
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:5690/ || exit 1
      start_period: 30s
      timeout: 5s
      interval: 30s
      retries: 3
    labels:
      traefik.enable: 'true'
      homelab.hostname: 'wizarr'
      traefik.http.routers.wizarr.middlewares: 'hsts@file'
      traefik.http.services.wizarr.loadbalancer.server.port: '5690'

networks:
  default:
  proxy:
    external: true
    name: homelab-proxy
